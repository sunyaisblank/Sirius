# CI matrix per docs/SPECIFICATION.md programme 6. WSL2 has no separate
# runner: it is binary-compatible with the Ubuntu job, whose Lavapipe
# software Vulkan exercises the same backend path WSL2 uses.
name: ci

on:
  push:
    branches: [main, rebuild/dngr-parity]
  pull_request:

jobs:
  linux-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 g++-14 gcc-14 ninja-build \
            libvulkan-dev mesa-vulkan-drivers spirv-tools \
            xorg-dev libgl1-mesa-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev
      - name: Slang
        run: |
          TAG=v2026.12.0.1
          curl --fail --location --silent --show-error \
            "https://github.com/shader-slang/slang/releases/download/${TAG}/slang-${TAG#v}-linux-x86_64.tar.gz" \
            --output slang.tgz
          sudo mkdir -p /opt/slang && sudo tar xzf slang.tgz -C /opt/slang
      - name: Configure
        run: cmake --preset linux-ci
      - name: Build (strict, mandatory gate on)
        run: cmake --build --preset linux-ci -j"$(nproc)"
      - name: Test estate
        run: ctest --preset linux-ci -j"$(nproc)"
      - name: Label file freshness
        run: python3 scripts/generate-ctest-labels.py --check

  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc
      - name: New-tree unit tests
        run: ctest --test-dir bin/windows-msvc -C Release -L Correctness --output-on-failure

  macos-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: brew install ninja
      - name: Configure
        run: cmake --preset macos
      - name: Build
        run: cmake --build --preset macos -j3
      - name: New-tree unit tests
        run: ctest --test-dir bin/macos -L Correctness --output-on-failure
