name: Native packed matched producer

on:
  push:
    branches:
      - development/native-fp32-packed-scratch-diagnostic-2026-10-18

permissions:
  contents: read

jobs:
  windows-matched-producer:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - name: Vulkan SDK qualification toolchain
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa
        with:
          vulkan_version: 1.4.357.0
          install_runtime: true
          cache: false
          stripdown: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile and stage the two matched private producers
        shell: pwsh
        run: ./out/native-constant-windows-source/build-and-stage.ps1
      - name: Preserve producer products and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sirius-native-packed-matched-producer
          path: bin/windows-msvc/private-native-packed-export
          include-hidden-files: true
          if-no-files-found: error
